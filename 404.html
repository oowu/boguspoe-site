<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · GAME OVER · boguspoe.dev</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1c2c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1c2c;--panel:#262b44;--text:#f4f4f4;--muted:#dde7ee;--accent:#ffcd75;--red:#ef7d57;--green:#a7f070;--pixel:'Press Start 2P',monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Pixelify Sans',monospace;font-weight:500;font-size:18px;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 2px,transparent 2px,transparent 4px);opacity:.6}
.box{position:relative;max-width:560px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px}
.code{font-family:var(--pixel);font-size:14px;color:var(--muted)}
h1{margin:0;font-family:var(--pixel);font-size:40px;line-height:1.3;color:var(--red);text-shadow:6px 6px 0 #000}
h1 span{display:block;animation:blink 1.2s steps(1) infinite}
.msg{margin:0;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.msg span{display:block}
.count{font-family:var(--pixel);font-size:56px;color:var(--accent);line-height:1}
.hint{font-family:var(--pixel);font-size:11px;color:var(--green);min-height:1.6em}
.btn{display:inline-block;font-family:var(--pixel);font-size:14px;color:var(--bg);background:var(--accent);padding:18px 22px;text-decoration:none;border:4px solid var(--text);box-shadow:6px 6px 0 #000}
.btn:hover,.btn:focus-visible{transform:translate(-3px,-3px);box-shadow:9px 9px 0 #000}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #000}
.ghost{width:96px;height:96px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);animation:bob 1s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (max-width:480px){h1{font-size:28px}.count{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<main class="box">
  <div class="ghost" id="ghost" role="img" aria-label="Разбитое пиксельное сердце"></div>
  <div class="code">ERROR 404</div>
  <h1><span>GAME OVER</span></h1>
  <p class="msg">
    <span lang="ru">Такой страницы нет.</span>
    <span lang="pl">Ta strona nie istnieje.</span>
    <span lang="en">This page doesn't exist.</span>
  </p>
  <div class="count" id="count" aria-live="polite">9</div>
  <a href="/" class="btn">CONTINUE? ▶</a>
  <div class="hint" id="hint"></div>
</main>
<script>
(function () {
  var map = ['.RR..RR.', 'RRRR.RRR', 'RWRR.RRR', 'RRR.RRRR', 'RRRR.RRR', '.RR.RRR.', '..RR.R..', '...R....'];
  var pal = { '.': 'transparent', R: '#ef7d57', W: '#f4f4f4' };
  var el = document.getElementById('ghost');
  map.forEach(function (row) {
    row.split('').forEach(function (ch) {
      var d = document.createElement('div');
      d.style.background = pal[ch];
      el.appendChild(d);
    });
  });

  var n = 9, count = document.getElementById('count'), hint = document.getElementById('hint');
  var t = setInterval(function () {
    n--;
    count.textContent = n;
    if (n <= 0) {
      clearInterval(t);
      hint.textContent = 'INSERT COIN';
    }
  }, 1000);
})();
</script>
</body>
</html>
